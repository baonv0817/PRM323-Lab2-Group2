<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Concept C</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:360px;height:800px;background:#1E130D;font-family:"Segoe UI",Arial,sans-serif;color:#FFF5E5;position:relative;overflow:hidden}
.bar{height:24px;font-size:12px;padding:4px 16px;color:#CDB8A6}
header{padding:12px 16px 8px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:20px;font-weight:800}
.icon{width:40px;height:40px;background:#3A261B;border-radius:20px;display:flex;align-items:center;justify-content:center}
.hero{margin:8px 16px 14px;height:150px;border-radius:20px;background:linear-gradient(135deg,#F69D39,#B45309);padding:16px;color:#2E1B12}
.hero small{font-size:12px;font-weight:700;background:#2E1B12;color:#F69D39;padding:3px 8px;border-radius:10px}
.hero b{display:block;font-size:24px;margin-top:14px;line-height:1.15}
.hero span{font-size:14px}
.chips{display:flex;gap:8px;margin:0 16px 14px}
.chips span{height:36px;padding:0 14px;border-radius:18px;background:#3A261B;font-size:14px;display:flex;align-items:center;color:#E8D6C4}
.chips .on{background:#F69D39;color:#2E1B12;font-weight:700}
h2{font-size:16px;margin:0 16px 8px;color:#E8D6C4}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 16px}
.card{background:#2E1D14;border-radius:16px;height:178px;padding:10px;position:relative}
.ph{height:84px;border-radius:12px;background:#4A3123}
.card .n{font-size:14px;font-weight:700;margin-top:8px;line-height:1.2}
.card .p{font-size:15px;font-weight:800;color:#F69D39;margin-top:6px}
.card .add{position:absolute;right:10px;bottom:10px;width:36px;height:36px;border-radius:18px;background:#F69D39;color:#2E1B12;display:flex;align-items:center;justify-content:center;font-weight:800}
.status{position:absolute;top:96px;right:28px;font-size:11px;color:#9FE3A9}
nav{position:absolute;bottom:0;left:0;right:0;height:64px;background:#2A1A12;display:flex}
nav div{flex:1;text-align:center;font-size:12px;padding-top:14px;color:#A8917F}
nav .on{color:#F69D39;font-weight:700}
</style></head><body>
<div class="bar">9:41</div>
<header><h1>FtaCode</h1><div class="icon">🛒</div></header>
<div class="hero"><small>● Kiosk Alpha mở</small><b>Combo Giờ Vàng<br>giảm 15%</b><span>Đặt trước, lấy trong ~7 phút</span></div>
<div class="chips"><span class="on">Tất cả</span><span>Tacos</span><span>Mì trộn</span><span>Nước</span></div>
<h2>Lấy nhanh dưới 5 phút</h2>
<div class="grid">
<div class="card"><div class="ph"></div><div class="n">Combo Tacos Bò Phô Mai</div><div class="p">39.000đ</div><div class="add">+</div></div>
<div class="card"><div class="ph"></div><div class="n">Mì Trộn Gà Cay</div><div class="p">35.000đ</div><div class="add">+</div></div>
</div>
<nav><div class="on">Trang chủ</div><div>Thực đơn</div><div>Theo dõi</div><div>Lịch sử</div></nav>
</body></html>
